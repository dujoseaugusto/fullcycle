name: CI - Tests (Cep only)

on:
  push:
    branches: [ main ]
    paths:
      - 'Cep/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Cep/**'

jobs:
  test-cep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Run go vet for Cep
        run: go vet ./Cep/...

      - name: Run tests for Cep
        run: go test ./Cep/... -v
